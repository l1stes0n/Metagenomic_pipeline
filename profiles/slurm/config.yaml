# Run from the workflow directory: snakemake --workflow-profile slurm
# Requires Snakemake >=9 and snakemake-executor-plugin-slurm.
executor: slurm

jobs: 20
local-cores: 1
latency-wait: 90
max-jobs-per-second: 2
max-status-checks-per-second: 5
# The Slurm plugin enforces a 40 s minimum between status check rounds.
seconds-between-status-checks: 40
rerun-incomplete: true
printshellcmds: true
software-deployment-method: conda

# Keep the documented logs/slurm location and retain successful job logs.
slurm-logdir: logs/slurm
slurm-keep-successful-logs: true

# Zero disables Snakemake's automatic input-size estimates. The Slurm plugin
# maps mem_mb to --mem only when it is nonzero, so no memory request is sent.
default-resources:
  - mem_mb=0
  - disk_mb=0
